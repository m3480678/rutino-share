<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rutino</title>
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const data = params.get('data');
  if (data) {
    window.location = 'rutino://share?data=' + data;
    setTimeout(function() {
      window.location = 'https://play.google.com/store/apps/details?id=com.innovatewave.rutino';
    }, 2000);
  } else {
    window.location = 'https://play.google.com/store/apps/details?id=com.innovatewave.rutino';
  }
</script>
<p>Rutino açılıyor...</p>
</body>
</html>
